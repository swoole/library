name: Tests

on: [ push, pull_request, workflow_dispatch ]

# This branch is the development branch of the library, which becomes the 6.3 series, so it is tested against
# the development branch of Swoole: the app image is built on the nightly phpswoole/swoole images (no tag prefix)
# and on the images of Swoole 6.3 (tag prefix "6.3-"), and the Swoole the Dockerfile compiles on top of either
# comes from branch master of swoole-src, which has no branch for 6.3 yet. Branch 6.2.x uses the images of Swoole
# 6.2 (tag prefix "6.2-") and branch 6.2 of swoole-src instead. The branch is `SWOOLE_BRANCH` below, the tag
# prefixes are the `image-tag-prefix` matrix.
env:
  SWOOLE_BRANCH: "master"

jobs:
  # Every image in the matrix gets built and booted, which is what proves the extension still compiles against
  # each PHP version. The checks on top of that each run on a subset of the matrix, as noted on the step.
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image-tag-prefix: ["", "6.3-"]
        php: ["8.2", "8.3", "8.4", "8.5"]

    name: Image phpswoole/swoole:${{ matrix.image-tag-prefix }}php${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Parsing runs once per PHP version because the analysis is PHP-version sensitive.
      - name: Run Syntax Checks
        if: matrix['image-tag-prefix'] == ''
        run: docker run -q --rm -v "$(pwd):/project" -w /project -i jakzal/phpqa:php${{ matrix.php }}-alpine phplint

      # The build of the app image is kept in the GitHub Actions cache (see docker-compose.ci.yml). Exporting a
      # build cache takes a builder of its own, as the one built into Docker cannot do it.
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The address and the token of the cache are only known to actions, not to the commands of a "run" step.
      # They are handed to the one step that builds the image, and to no other.
      - name: Get Access To The Build Cache
        id: cache
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('url', process.env.ACTIONS_RESULTS_URL || '');
            core.setOutput('token', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Prepare Test Environment
        env:
          # Build arguments of the app image, together with SWOOLE_BRANCH from the top of this file:
          # docker-compose.yml hands the three variables on to the Dockerfile.
          IMAGE_TAG_PREFIX: ${{ matrix.image-tag-prefix }}
          PHP_VERSION: ${{ matrix.php }}
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
          ACTIONS_RESULTS_URL: ${{ steps.cache.outputs.url }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.cache.outputs.token }}
        run: |
          docker compose pull
          docker compose build
          docker compose up -d

          docker compose exec -T app php -v
          docker compose exec -T app php --ri swoole
          docker compose exec -T app composer install -n -q --no-progress

          sleep 40s

      # Coding style does not depend on the PHP version the code runs on, so it is checked once.
      - name: Run Coding Style Checks
        if: matrix.php == '8.4' && matrix['image-tag-prefix'] == ''
        run: docker compose exec -T app composer cs-fix -- --dry-run --show-progress=none

      # PHPStan resolves Swoole symbols from the swoole/ide-helper stubs rather than from the loaded extension
      # (see phpstan.neon.dist), so the result does not depend on which Swoole build it runs against.
      - name: Run Static Analysis
        if: matrix.php == '8.4' && matrix['image-tag-prefix'] == ''
        run: docker compose exec -T app ./vendor/bin/phpstan analyse --no-progress --memory-limit 2G

      # Unit tests run on the oldest and the newest PHP version of the matrix only. Those two are where a
      # version-dependent break shows up: the oldest still has to work without the newer syntax and functions,
      # the newest is where deprecations and behaviour changes land first. The versions in between run the
      # same library code against the same services, so they mostly repeat what those two already prove.
      # Keep this in step with the `php` matrix above whenever a version is added or dropped.
      - name: Run Unit Tests
        if: matrix.php == '8.2' || matrix.php == '8.5'
        run: docker compose exec -T app composer test
