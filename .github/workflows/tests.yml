name: Tests

on: [ push, pull_request, workflow_dispatch ]

jobs:
  # Every image in the matrix gets built and booted, which is what proves the extension still compiles against
  # each PHP version. The checks on top of that each run on a subset of the matrix, as noted on the step.
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image-tag-prefix: ["", "6.2-"]
        php: ["8.2", "8.3", "8.4", "8.5"]

    name: Image phpswoole/swoole:${{ matrix.image-tag-prefix }}php${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Parsing runs once per PHP version because the analysis is PHP-version sensitive.
      - name: Run Syntax Checks
        if: matrix['image-tag-prefix'] == ''
        run: docker run -q --rm -v "$(pwd):/project" -w /project -i jakzal/phpqa:php${{ matrix.php }}-alpine phplint

      - name: Prepare Test Environment
        env:
          IMAGE_TAG_PREFIX: ${{ matrix.image-tag-prefix }}
          PHP_VERSION: ${{ matrix.php }}
        run: |
          docker compose pull
          docker compose build
          docker compose up -d

          docker compose exec -T app php -v
          docker compose exec -T app php --ri swoole
          docker compose exec -T app composer install -n -q --no-progress

          sleep 40s

      # Coding style does not depend on the PHP version the code runs on, so it is checked once.
      - name: Run Coding Style Checks
        if: matrix.php == '8.4' && matrix['image-tag-prefix'] == ''
        run: docker compose exec -T app composer cs-fix -- --dry-run --show-progress=none

      # PHPStan resolves Swoole symbols from the swoole/ide-helper stubs rather than from the loaded extension
      # (see phpstan.neon.dist), so the result does not depend on which Swoole build it runs against.
      - name: Run Static Analysis
        if: matrix.php == '8.4' && matrix['image-tag-prefix'] == ''
        run: docker compose exec -T app ./vendor/bin/phpstan analyse --no-progress --memory-limit 2G

      # Unit tests run on the oldest and the newest PHP version of the matrix only. Those two are where a
      # version-dependent break shows up: the oldest still has to work without the newer syntax and functions,
      # the newest is where deprecations and behaviour changes land first. The versions in between run the
      # same library code against the same services, so they mostly repeat what those two already prove --
      # while adding load on the external services the tests query, httpbin.org above all, which throttles.
      # Keep this in step with the `php` matrix above whenever a version is added or dropped.
      - name: Run Unit Tests
        if: matrix.php == '8.2' || matrix.php == '8.5'
        run: docker compose exec -T app composer test
